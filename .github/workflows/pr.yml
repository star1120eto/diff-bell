name: PR Check

on:
  pull_request:
    branches:
      - main

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # ============================================================
  # Job 1: ビルド確認（tsc -b 込み）
  # lint / format / typecheck / unit tests はローカルの husky で実施
  # ============================================================
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (tsc -b + vite)
        run: pnpm build

  # ============================================================
  # Job 2: Edge Functions 型チェック + ユニットテスト (Deno)
  # ============================================================
  edge-functions:
    name: Edge Functions (Deno)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type check Edge Functions
        run: |
          deno check \
            --config supabase/functions/deno.json \
            supabase/functions/_shared/url-checker.ts \
            supabase/functions/_shared/robots.ts \
            supabase/functions/_shared/supabase.ts \
            supabase/functions/_shared/email.ts \
            supabase/functions/_shared/slack.ts \
            supabase/functions/check-single-monitor/index.ts \
            supabase/functions/check-due-monitors/index.ts \
            supabase/functions/send-notifications/index.ts \
            supabase/functions/cleanup-old-snapshots/index.ts \
            supabase/functions/send-test-notification/index.ts
        env:
          DENO_DIR: ${{ github.workspace }}/.deno-cache

      - name: Run Edge Function unit tests
        run: |
          deno test \
            --config supabase/functions/deno.json \
            supabase/functions/_shared/url-checker.test.ts \
            supabase/functions/_shared/robots.test.ts
        env:
          DENO_DIR: ${{ github.workspace }}/.deno-cache

  # ============================================================
  # Job 3: DB マイグレーション + pgTAP + 統合テスト
  # supabase start を 1 回にまとめて高速化
  # ============================================================
  db-and-integration:
    name: DB & Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start Supabase local (マイグレーション適用を兼ねる)
        run: |
          supabase start
          SUPABASE_ANON_KEY=$(supabase status --output json | jq -r '.ANON_KEY')
          SUPABASE_SERVICE_ROLE_KEY=$(supabase status --output json | jq -r '.SERVICE_ROLE_KEY')
          echo "SUPABASE_URL=http://localhost:54321" >> $GITHUB_ENV
          echo "SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}" >> $GITHUB_ENV
          echo "SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}" >> $GITHUB_ENV

      - name: Run pgTAP RLS tests
        run: supabase test db

      - name: Run integration tests
        run: pnpm test:integration

      - name: Stop Supabase
        if: always()
        run: supabase stop --backup
