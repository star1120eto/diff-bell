name: diff-bell

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/workspace
      - pnpm-store:/root/.local/share/pnpm/store
      - node-modules:/workspace/node_modules
    ports:
      - "5173:5173"
    environment:
      - VITE_SUPABASE_URL=${VITE_SUPABASE_URL:-http://localhost:54321}
      - VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY:-}
      - VITE_APP_URL=${VITE_APP_URL:-http://localhost:5173}
    env_file:
      - path: .env
        required: false
    depends_on:
      - supabase-db
    networks:
      - diffbell
    command: pnpm dev --host

  # Supabase Studio へのアクセスは supabase start が別途必要
  # このサービスは DB が起動済みかのヘルスチェック用
  supabase-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "54322:5432"
    networks:
      - diffbell
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pnpm-store:
  node-modules:

networks:
  diffbell:
    driver: bridge
